<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 555" font-family="Arial,sans-serif" role="img" aria-label="All seven implemented app screens and navigation"><title>OutLoud PR31 complete app navigation</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#242424"/></marker></defs><path d="M280 116H365" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="322" y="105" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Pull up / Add</text><path d="M605 116H690" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="647" y="105" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Save setup</text><path d="M160 80V30H810V80" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="485" y="21" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Tap selected presentation</text><path d="M160 152V390H365" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="235" y="379" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Tap score ring</text><path d="M930 116H1015" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="973" y="104" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Redo saved</text><path d="M740 152V240H485V350" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="580" y="230" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >First saved take</text><path d="M810 152V350" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="870" y="282" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Later saved take</text><path d="M1135 152V215H885V350" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="1060" y="199" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Confirm choice: later → Slide; first → Full</text><path d="M1135 152V256H485V350" stroke="#626262" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4"/><text x="500" y="256" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" ></text><path d="M605 385H690" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="647" y="374" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Tap slide</text><path d="M930 385H1015" stroke="#242424" stroke-width="1.5" fill="none" marker-end="url(#arr)" /><text x="972" y="373" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Swipe up</text><path d="M1040 422V480H900V422" stroke="#626262" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4"/><text x="1040" y="503" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Back to review</text><path d="M785 422V480H485V422" stroke="#626262" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4"/><text x="643" y="503" font-size="12" fill="#626262" font-weight="400" text-anchor="middle" >Full Review action / return</text><a href="#A1"><rect x="40" y="80" width="240" height="72" rx="9" fill="#ffffff" stroke="#242424" /><text x="56" y="108" font-size="17" fill="#242424" font-weight="500" text-anchor="start" >Home</text><text x="56" y="131" font-size="11" fill="#626262" font-weight="400" text-anchor="start" >A1 · deck carousel / library</text></a><a href="#A6"><rect x="365" y="80" width="240" height="72" rx="9" fill="#ffffff" stroke="#242424" /><text x="381" y="108" font-size="17" fill="#242424" font-weight="500" text-anchor="start" >Add presentation</text><text x="381" y="131" font-size="11" fill="#626262" font-weight="400" text-anchor="start" >A6 → B1 → B3</text></a><a href="#B6"><rect x="690" y="80" width="240" height="72" rx="9" fill="#ffffff" stroke="#242424" /><text x="706" y="108" font-size="17" fill="#242424" font-weight="500" text-anchor="start" >Rehearse</text><text x="706" y="131" font-size="11" fill="#626262" font-weight="400" text-anchor="start" >B6 · slides / cues / capture</text></a><a href="#G1"><rect x="1015" y="80" width="240" height="72" rx="9" fill="#ffffff" stroke="#242424" /><text x="1031" y="108" font-size="17" fill="#242424" font-weight="500" text-anchor="start" >Compare</text><text x="1031" y="131" font-size="11" fill="#626262" font-weight="400" text-anchor="start" >G1 · Keep current / Overwrite</text></a><a href="#E1"><rect x="365" y="350" width="240" height="72" rx="9" fill="#ffffff" stroke="#242424" /><text x="381" y="378" font-size="17" fill="#242424" font-weight="500" text-anchor="start" >Full Review</text><text x="381" y="401" font-size="11" fill="#626262" font-weight="400" text-anchor="start" >E1 · whole run / scores</text></a><a href="#E3"><rect x="690" y="350" width="240" height="72" rx="9" fill="#ffffff" stroke="#242424" /><text x="706" y="378" font-size="17" fill="#242424" font-weight="500" text-anchor="start" >Slide Review</text><text x="706" y="401" font-size="11" fill="#626262" font-weight="400" text-anchor="start" >E3 · audio / text / feedback</text></a><a href="#H2"><rect x="1015" y="350" width="240" height="72" rx="9" fill="#ffffff" stroke="#242424" /><text x="1031" y="378" font-size="17" fill="#242424" font-weight="500" text-anchor="start" >Audience Q&amp;A</text><text x="1031" y="401" font-size="11" fill="#626262" font-weight="400" text-anchor="start" >H2 · answer / follow-up / archive</text></a><text x="40" y="546" font-size="12" fill="#626262" font-weight="400" text-anchor="start" >Solid: main transitions. Dashed: conditional choice or return. Android Back follows the active screen’s return context.</text></svg>