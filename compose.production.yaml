# AI-assisted deployment configuration, OpenAI Codex, Iteration 2 (2026-10-31).
# Standalone private-team stack; do not merge with the local Compose file.
name: outloud-production

x-backend: &backend
  image: outloud-backend:${OUTLOUD_IMAGE_TAG:-team}
  build:
    context: ./backend
    dockerfile: Dockerfile.production
  env_file: deploy/.env
  environment:
    DJANGO_SETTINGS_MODULE: config.production_settings
    DJANGO_DEBUG: "0"
    POSTGRES_HOST: db
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes:
    - media_data:/app/media
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,urllib.request;
          urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/health/',headers={'Host':os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0],'X-Forwarded-Proto':'https'}),timeout=5).close()
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info --concurrency=1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping --destination "celery@$${HOSTNAME}" --timeout=5 | grep -q pong']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  scheduler:
    <<: *backend
    command: celery -A config beat --loglevel=info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'kill -0 "$$(cat /tmp/celerybeat.pid)"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
