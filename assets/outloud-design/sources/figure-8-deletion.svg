<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1728" viewBox="0 0 500 1728"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#333"/></marker></defs><rect width="500" height="1728" fill="white"/><g transform="translate(0 0)"><text x="6" y="18" font-family="Arial" font-size="14" font-weight="bold" fill="#111">Figure 8. Deletion and recovery - 1 of 3 (Planned)</text><rect x="1" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="8" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Presenter</text><polyline points="48,76 48,584" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="133" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="140" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Controller /</text><text x="140" y="64" font-family="Arial" font-size="11" font-weight="normal" fill="#111">local journal</text><polyline points="180,76 180,584" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="265" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="272" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Authorized</text><text x="272" y="64" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Django API</text><polyline points="312,76 312,584" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="397" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="404" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Cleanup /</text><text x="404" y="64" font-family="Arial" font-size="11" font-weight="normal" fill="#111">media worker</text><polyline points="444,76 444,584" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="8" y="86" width="484" height="14" fill="white"/><text x="13" y="97" font-family="Arial" font-size="11" font-weight="normal" fill="#111">1. Delete attempt or deck.</text><polyline points="48,107 180,107" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="8" y="123" width="484" height="14" fill="white"/><text x="13" y="134" font-family="Arial" font-size="11" font-weight="normal" fill="#111">2. Explain scope: deck deletion includes its attempts and generated data.</text><polyline points="180,144 48,144" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="6" y="161" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#111">alt Cancel</text><rect x="8" y="195" width="484" height="14" fill="white"/><text x="13" y="206" font-family="Arial" font-size="11" font-weight="normal" fill="#111">3. Cancel; preserve all data.</text><polyline points="48,216 180,216" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="6" y="233" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="250" font-family="Arial" font-size="11" font-weight="bold" fill="#111">else Confirm - the remaining panels follow this branch</text><rect x="8" y="267" width="484" height="14" fill="white"/><text x="13" y="278" font-family="Arial" font-size="11" font-weight="normal" fill="#111">4. Confirm target.</text><polyline points="48,288 180,288" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="17" y="304" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="318" font-family="Arial" font-size="11" font-weight="normal" fill="#111">5. Journal intent, stop playback/upload, hide target.</text><polyline points="180,334 198,334 198,342 180,342" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="6" y="350" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="367" font-family="Arial" font-size="11" font-weight="bold" fill="#111">alt Local-only target</text><rect x="17" y="384" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="398" font-family="Arial" font-size="11" font-weight="normal" fill="#111">6. No server request is required; continue with local cleanup in panel 3.</text><polyline points="180,414 198,414 198,422 180,422" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="6" y="430" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="447" font-family="Arial" font-size="11" font-weight="bold" fill="#111">else Server-backed and offline / unreachable</text><rect x="17" y="464" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="478" font-family="Arial" font-size="11" font-weight="normal" fill="#111">7. Remove local copies; keep a pending-server tombstone.</text><polyline points="180,494 198,494 198,502 180,502" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="8" y="509" width="484" height="14" fill="white"/><text x="13" y="520" font-family="Arial" font-size="11" font-weight="normal" fill="#111">8. Local removal done; server deletion pending. Retry after reconnect.</text><polyline points="180,530 48,530" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="6" y="547" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="564" font-family="Arial" font-size="11" font-weight="bold" fill="#111">else Server-backed and reachable: continue in panel 2</text></g><g transform="translate(0 597)"><text x="6" y="18" font-family="Arial" font-size="14" font-weight="bold" fill="#111">Figure 8. Deletion and recovery - 2 of 3 (Planned)</text><rect x="1" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="8" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Presenter</text><polyline points="48,76 48,554" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="133" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="140" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Controller /</text><text x="140" y="64" font-family="Arial" font-size="11" font-weight="normal" fill="#111">local journal</text><polyline points="180,76 180,554" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="265" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="272" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Authorized</text><text x="272" y="64" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Django API</text><polyline points="312,76 312,554" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="397" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="404" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Cleanup /</text><text x="404" y="64" font-family="Arial" font-size="11" font-weight="normal" fill="#111">media worker</text><polyline points="444,76 444,554" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="8" y="86" width="484" height="14" fill="white"/><text x="13" y="97" font-family="Arial" font-size="11" font-weight="normal" fill="#111">9. DELETE attempt/deck with authenticated identity.</text><polyline points="180,107 312,107" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="17" y="123" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="137" font-family="Arial" font-size="11" font-weight="normal" fill="#111">10. Check owner, lock target, mark deleting; persist DeletionOperation and file manifest.</text><polyline points="312,153 330,153 330,161 312,161" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="8" y="168" width="484" height="14" fill="white"/><text x="13" y="179" font-family="Arial" font-size="11" font-weight="normal" fill="#111">11. Admit cleanup after commit (asynchronous background task).</text><polyline points="312,189 444,189" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="8" y="205" width="484" height="14" fill="white"/><text x="13" y="216" font-family="Arial" font-size="11" font-weight="normal" fill="#111">12. Return operation ID and pending status.</text><polyline points="312,226 180,226" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="6" y="243" width="488" height="44" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="262" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Block new child records, jobs and media reads. Workers check deletion before provider calls and</text><text x="14" y="276" font-family="Arial" font-size="11" font-weight="normal" fill="#111">final writes, discarding late output. Queue cancellation alone is insufficient.</text><rect x="17" y="294" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="308" font-family="Arial" font-size="11" font-weight="normal" fill="#111">13. Reconcile reservations; remove dependent jobs, results and receipts.</text><polyline points="444,324 462,324 462,332 444,332" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="6" y="340" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="357" font-family="Arial" font-size="11" font-weight="bold" fill="#111">alt Attempt target</text><rect x="17" y="374" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="388" font-family="Arial" font-size="11" font-weight="normal" fill="#111">14. Remove attempt; preserve deck and reusable descriptions.</text><polyline points="444,404 462,404 462,412 444,412" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="6" y="420" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="437" font-family="Arial" font-size="11" font-weight="bold" fill="#111">else Deck target</text><rect x="17" y="454" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="468" font-family="Arial" font-size="11" font-weight="normal" fill="#111">15. Remove attempts, description dependencies, slides, then deck.</text><polyline points="444,484 462,484 462,492 444,492" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="6" y="500" width="488" height="44" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="519" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Explicit dependency order resolves current PROTECT references. The current schema deletion</text><text x="14" y="533" font-family="Arial" font-size="11" font-weight="normal" fill="#111">policy does not silently change. Continue with file cleanup in panel 3.</text></g><g transform="translate(0 1164)"><text x="6" y="18" font-family="Arial" font-size="14" font-weight="bold" fill="#111">Figure 8. Deletion and recovery - 3 of 3 (Planned)</text><rect x="1" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="8" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Presenter</text><polyline points="48,76 48,551" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="133" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="140" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Controller /</text><text x="140" y="64" font-family="Arial" font-size="11" font-weight="normal" fill="#111">local journal</text><polyline points="180,76 180,551" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="265" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="272" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Authorized</text><text x="272" y="64" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Django API</text><polyline points="312,76 312,551" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="397" y="34" width="94" height="42" fill="white" stroke="#555" stroke-width="0.8"/><text x="404" y="50" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Cleanup /</text><text x="404" y="64" font-family="Arial" font-size="11" font-weight="normal" fill="#111">media worker</text><polyline points="444,76 444,551" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3"/><rect x="17" y="86" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="100" font-family="Arial" font-size="11" font-weight="normal" fill="#111">16. Delete manifest files idempotently.</text><polyline points="444,116 462,116 462,124 444,124" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="6" y="132" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="149" font-family="Arial" font-size="11" font-weight="bold" fill="#111">alt File or cleanup failure</text><rect x="17" y="166" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="180" font-family="Arial" font-size="11" font-weight="normal" fill="#111">17. Retain remaining manifest and failure; schedule bounded retry.</text><polyline points="444,196 462,196 462,204 444,204" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="6" y="212" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="229" font-family="Arial" font-size="11" font-weight="bold" fill="#111">else Server cleanup complete</text><rect x="17" y="246" width="466" height="36" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="260" font-family="Arial" font-size="11" font-weight="normal" fill="#111">18. Mark server complete; keep minimal operation tombstone.</text><polyline points="444,276 462,276 462,284 444,284" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="6" y="292" width="488" height="26" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="309" font-family="Arial" font-size="11" font-weight="bold" fill="#111">end - reconcile status and finish local cleanup</text><rect x="8" y="326" width="484" height="14" fill="white"/><text x="13" y="337" font-family="Arial" font-size="11" font-weight="normal" fill="#111">19. Read operation status; retry pending request after reconnect.</text><polyline points="180,347 312,347" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="8" y="363" width="484" height="14" fill="white"/><text x="13" y="374" font-family="Arial" font-size="11" font-weight="normal" fill="#111">20. Pending / retryable / server complete.</text><polyline points="312,384 180,384" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="17" y="400" width="466" height="50" fill="white" stroke="#555" stroke-width="0.8"/><text x="25" y="414" font-family="Arial" font-size="11" font-weight="normal" fill="#111">21. Purge local audio, results, checkpoints and unreferenced PDFs. Record cleanup</text><text x="25" y="428" font-family="Arial" font-size="11" font-weight="normal" fill="#111">progress; retry failed removals.</text><polyline points="180,444 198,444 198,452 180,452" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><rect x="8" y="459" width="484" height="14" fill="white"/><text x="13" y="470" font-family="Arial" font-size="11" font-weight="normal" fill="#111">22. Complete only when applicable local and server work is done.</text><polyline points="180,480 48,480" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="6" y="497" width="488" height="44" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="516" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Other devices reconcile tombstones when online. Original files outside the app are untouched.</text><text x="14" y="530" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Retention policy remains open.</text></g></svg>