# AI-assisted deployment configuration, OpenAI Codex, Iteration 2 (2026-10-31).
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 64m;
    client_body_timeout 180s;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Only trusted TLS edges reach this proxy: host-loopback Tailscale Serve or
    # Caddy on the isolated edge network. Both supply HTTPS forwarding headers.
    location /api/ {
        # shortcut: Android-only API; add web-client CSRF handling before enabling
        # browser JavaScript clients. Network access alone does not prevent CSRF.
        if ($http_origin != "") { return 403; }
        if ($http_x_forwarded_proto != "https") { return 403; }
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /media/ {
        if ($http_x_forwarded_proto != "https") { return 403; }
        alias /srv/media/;
        autoindex off;
        # Only application-generated media types may render inline.
        types {
            application/pdf pdf;
            image/png png;
            audio/mp4 m4a;
            video/mp4 mp4;
            audio/mpeg mp3 mpeg mpga;
            audio/wav wav;
            audio/webm webm;
        }
        default_type application/octet-stream;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private" always;
    }

    location / {
        return 404;
    }
}
