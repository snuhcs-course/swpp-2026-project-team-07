map $request_method $store_write_client {
    default "";
    POST    $http_x_outloud_client_ip;
    PUT     $http_x_outloud_client_ip;
    PATCH   $http_x_outloud_client_ip;
    DELETE  $http_x_outloud_client_ip;
}
limit_req_zone $store_write_client zone=store_writes:2m rate=60r/m;
limit_conn_zone $http_x_outloud_client_ip zone=store_connections:2m;
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 64m;
    client_body_timeout 180s;
    limit_req_status 429;
    limit_conn_status 429;

    location = /healthz { return 200 "ok\n"; }
    location = /privacy/ {
        root /srv;
        try_files /store-privacy.html =404;
        default_type text/html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(api|media)/ {
        if ($http_origin != "") { return 403; }
        if ($http_x_forwarded_proto != "https") { return 403; }
        if ($http_x_outloud_client_ip = "") { return 403; }
        limit_req zone=store_writes burst=24 nodelay;
        limit_conn store_connections 12;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_x_outloud_client_ip;
        proxy_set_header X-Forwarded-For $http_x_outloud_client_ip;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /__store_media/ {
        internal;
        alias /srv/media/;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
        types {
            application/pdf pdf;
            image/png png;
            audio/mp4 m4a;
            video/mp4 mp4;
            audio/mpeg mp3 mpeg mpga;
            audio/wav wav;
            audio/webm webm;
        }
        default_type application/octet-stream;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
