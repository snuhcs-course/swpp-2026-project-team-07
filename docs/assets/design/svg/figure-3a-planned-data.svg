<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1021" viewBox="0 0 500 1021"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#333"/></marker></defs><rect width="500" height="1021" fill="white"/><g transform="translate(0 0)"><text x="6" y="18" font-family="Arial" font-size="14" font-weight="bold" fill="#111">Figure 3A. Proposed data extension - 1 of 2</text><text x="6" y="38" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Planned conceptual entities and fields; PK / FK / UQ shown.</text><rect x="120" y="53" width="260" height="76" fill="white" stroke="#555" stroke-width="0.8"/><text x="128" y="70" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Owner (proposed)</text><path d="M120 78H380" fill="none" stroke="#777" stroke-width="0.6"/><text x="128" y="94" font-family="Arial" font-size="11" font-weight="normal" fill="#111">PK id; UQ (issuer, subject)</text><text x="128" y="108" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Maps validated identity token.</text><rect x="6" y="188" width="238" height="76" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="205" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Deck (existing + owner)</text><path d="M6 213H244" fill="none" stroke="#777" stroke-width="0.6"/><text x="14" y="229" font-family="Arial" font-size="11" font-weight="normal" fill="#111">PK id; FK owner_id [new]</text><text x="14" y="243" font-family="Arial" font-size="11" font-weight="normal" fill="#111">UQ owner + hash + prep version</text><rect x="256" y="188" width="238" height="118" fill="white" stroke="#555" stroke-width="0.8"/><text x="264" y="205" font-family="Arial" font-size="11" font-weight="bold" fill="#111">DeletionOperation (proposed)</text><path d="M256 213H494" fill="none" stroke="#777" stroke-width="0.6"/><text x="264" y="229" font-family="Arial" font-size="11" font-weight="normal" fill="#111">PK id; FK owner_id</text><text x="264" y="243" font-family="Arial" font-size="11" font-weight="normal" fill="#111">target_type / target_uuid</text><text x="264" y="257" font-family="Arial" font-size="11" font-weight="normal" fill="#111">state; file manifest; progress</text><text x="264" y="271" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Target UUID survives row deletion.</text><polyline points="180,129 180,151 125,151 125,188" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="47" y="166" font-family="Arial" font-size="11" font-weight="normal" fill="#111">1 to 0..*</text><polyline points="320,129 320,151 375,151 375,188" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="390" y="166" font-family="Arial" font-size="11" font-weight="normal" fill="#111">1 to 0..*</text><rect x="6" y="322" width="238" height="76" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="339" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Attempt (existing)</text><path d="M6 347H244" fill="none" stroke="#777" stroke-width="0.6"/><text x="14" y="363" font-family="Arial" font-size="11" font-weight="normal" fill="#111">PK id; FK deck_id</text><text x="14" y="377" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Transcript and visits stay here.</text><polyline points="125,264 125,322" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="139" y="299" font-family="Arial" font-size="11" font-weight="normal" fill="#111">1 to 0..*</text><rect x="256" y="350" width="238" height="132" fill="white" stroke="#555" stroke-width="0.8"/><text x="264" y="367" font-family="Arial" font-size="11" font-weight="bold" fill="#111">AttemptSelection (proposed)</text><path d="M256 375H494" fill="none" stroke="#777" stroke-width="0.6"/><text x="264" y="391" font-family="Arial" font-size="11" font-weight="normal" fill="#111">PK/FK attempt_id (one per attempt)</text><text x="264" y="405" font-family="Arial" font-size="11" font-weight="normal" fill="#111">selected_slide_indexes: JSON</text><text x="264" y="419" font-family="Arial" font-size="11" font-weight="normal" fill="#111">source_attempt_id: nullable FK</text><text x="264" y="433" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Freeze original indexes; keep repeats.</text><text x="264" y="447" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Legacy attempts may have no row.</text><polyline points="125,398 125,443 256,443" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="151" y="421" font-family="Arial" font-size="11" font-weight="normal" fill="#111">1 to 0..1</text><polyline points="270,350 270,335 244,335" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="265" y="327" font-family="Arial" font-size="11" font-weight="normal" fill="#111">source attempt: 0..1</text><text x="6" y="506" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Selection records use original deck indexes. Repeated visits remain in Attempt JSON. Deletion</text><text x="6" y="520" font-family="Arial" font-size="11" font-weight="normal" fill="#111">blocks new work, removes dependent rows in order, then retries file cleanup from a durable</text><text x="6" y="534" font-family="Arial" font-size="11" font-weight="normal" fill="#111">manifest.</text></g><g transform="translate(0 570)"><text x="6" y="18" font-family="Arial" font-size="14" font-weight="bold" fill="#111">Figure 3A. Proposed data extension - 2 of 2</text><text x="6" y="38" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Planned runs depend on the existing Attempt, independently.</text><rect x="120" y="54" width="260" height="62" fill="white" stroke="#555" stroke-width="0.8"/><text x="128" y="71" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Attempt (existing)</text><path d="M120 79H380" fill="none" stroke="#777" stroke-width="0.6"/><text x="128" y="95" font-family="Arial" font-size="11" font-weight="normal" fill="#111">PK id; transcript and slide visits in JSON</text><rect x="6" y="176" width="238" height="132" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="193" font-family="Arial" font-size="11" font-weight="bold" fill="#111">SummaryRun (proposed)</text><path d="M6 201H244" fill="none" stroke="#777" stroke-width="0.6"/><text x="14" y="217" font-family="Arial" font-size="11" font-weight="normal" fill="#111">PK id; FK attempt_id</text><text x="14" y="231" font-family="Arial" font-size="11" font-weight="normal" fill="#111">generation / state / transcript digest</text><text x="14" y="245" font-family="Arial" font-size="11" font-weight="normal" fill="#111">selection digest; provider / model</text><text x="14" y="259" font-family="Arial" font-size="11" font-weight="normal" fill="#111">prompt version; per-visit summaries</text><text x="14" y="273" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Word evidence and failure state</text><rect x="256" y="176" width="238" height="132" fill="white" stroke="#555" stroke-width="0.8"/><text x="264" y="193" font-family="Arial" font-size="11" font-weight="bold" fill="#111">DeliveryRun (proposed)</text><path d="M256 201H494" fill="none" stroke="#777" stroke-width="0.6"/><text x="264" y="217" font-family="Arial" font-size="11" font-weight="normal" fill="#111">PK id; FK attempt_id</text><text x="264" y="231" font-family="Arial" font-size="11" font-weight="normal" fill="#111">generation / state / source digest</text><text x="264" y="245" font-family="Arial" font-size="11" font-weight="normal" fill="#111">rule version; metric availability</text><text x="264" y="259" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Rates, timed filler and pause events</text><text x="264" y="273" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Visit IDs reference Attempt JSON</text><polyline points="200,116 200,141 125,141 125,176" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="50" y="156" font-family="Arial" font-size="11" font-weight="normal" fill="#111">1 to 0..*</text><polyline points="300,116 300,141 375,141 375,176" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="390" y="156" font-family="Arial" font-size="11" font-weight="normal" fill="#111">1 to 0..*</text><text x="6" y="338" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Runs retain independent state and source versions. A failed analysis never replaces the transcript.</text><text x="6" y="382" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Descriptions remain deck-scoped. Existing coaching snapshots need a practiced-scope projection</text><text x="6" y="396" font-family="Arial" font-size="11" font-weight="normal" fill="#111">(Section 8.3).</text></g></svg>