<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1238" viewBox="0 0 500 1238"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#333"/></marker></defs><rect width="500" height="1238" fill="white"/><g transform="translate(0 0)"><text x="6" y="18" font-family="Arial" font-size="14" font-weight="bold" fill="#111">Figure 6. Frontend architecture - 1 of 2</text><text x="6" y="37" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Planned controller/layout design; dashed arrows are callbacks.</text><rect x="105" y="51" width="290" height="62" fill="white" stroke="#555" stroke-width="0.8"/><text x="113" y="68" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Expo Router</text><path d="M105 76H395" fill="none" stroke="#777" stroke-width="0.6"/><text x="113" y="92" font-family="Arial" font-size="11" font-weight="normal" fill="#111">src/app: route parameters and screen mounting</text><polyline points="250,113 250,143" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="263" y="133" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Mount feature hosts</text><text x="6" y="161" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Shared hosts / controllers own behavior and state</text><rect x="6" y="173" width="238" height="112" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="190" font-family="Arial" font-size="11" font-weight="bold" fill="#111">LibraryScreen / ViewerScreen</text><path d="M6 198H244" fill="none" stroke="#777" stroke-width="0.6"/><text x="14" y="214" font-family="Arial" font-size="11" font-weight="normal" fill="#111">useLibraryController / useSetupController</text><text x="14" y="228" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Import, history, confirmed PDF page.</text><text x="14" y="242" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Planned: slide selection and deletion.</text><rect x="256" y="173" width="238" height="112" fill="white" stroke="#555" stroke-width="0.8"/><text x="264" y="190" font-family="Arial" font-size="11" font-weight="bold" fill="#111">RehearsalScreen</text><path d="M256 198H494" fill="none" stroke="#777" stroke-width="0.6"/><text x="264" y="214" font-family="Arial" font-size="11" font-weight="normal" fill="#111">useRecordingController</text><text x="264" y="228" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Permission, capture, checkpoints, durable</text><text x="264" y="242" font-family="Arial" font-size="11" font-weight="normal" fill="#111">save.</text><rect x="6" y="297" width="238" height="112" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="314" font-family="Arial" font-size="11" font-weight="bold" fill="#111">SavedAttemptScreen</text><path d="M6 322H244" fill="none" stroke="#777" stroke-width="0.6"/><text x="14" y="338" font-family="Arial" font-size="11" font-weight="normal" fill="#111">useSavedReviewController</text><text x="14" y="352" font-family="Arial" font-size="11" font-weight="normal" fill="#111">One player, seek, consent, analysis state.</text><text x="14" y="366" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Planned: key ideas, delivery, comparison.</text><rect x="256" y="297" width="238" height="112" fill="white" stroke="#555" stroke-width="0.8"/><text x="264" y="314" font-family="Arial" font-size="11" font-weight="bold" fill="#111">FeedbackPanel</text><path d="M256 322H494" fill="none" stroke="#777" stroke-width="0.6"/><text x="264" y="338" font-family="Arial" font-size="11" font-weight="normal" fill="#111">useFeedbackController</text><text x="264" y="352" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Generation, drafts, edits, evidence actions.</text><text x="264" y="366" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Planned: practiced-slide scope.</text><polyline points="250,414 250,445" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="263" y="435" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Display model</text><rect x="44" y="446" width="412" height="76" fill="white" stroke="#555" stroke-width="0.8"/><text x="52" y="463" font-family="Arial" font-size="11" font-weight="bold" fill="#111">layouts/contracts.ts</text><path d="M44 471H456" fill="none" stroke="#777" stroke-width="0.6"/><text x="52" y="487" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Display models and guarded callbacks; opaque native surfaces.</text><text x="52" y="501" font-family="Arial" font-size="11" font-weight="normal" fill="#111">No raw services. Planned: selection, analysis and deletion states.</text><polyline points="250,522 250,551" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="263" y="542" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Render model</text><rect x="44" y="552" width="412" height="62" fill="white" stroke="#555" stroke-width="0.8"/><text x="52" y="569" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Interchangeable views</text><path d="M44 577H456" fill="none" stroke="#777" stroke-width="0.6"/><text x="52" y="593" font-family="Arial" font-size="11" font-weight="normal" fill="#111">activeLayout views and navigation shells (continued in panel 2).</text><polyline points="44,582 18,582 18,421 118,421 118,409" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/></g><g transform="translate(0 618)"><text x="6" y="18" font-family="Arial" font-size="14" font-weight="bold" fill="#111">Figure 6. Frontend architecture - 2 of 2</text><text x="6" y="39" font-family="Arial" font-size="11" font-weight="normal" fill="#111">User actions call the hosts through guarded callbacks (dashed return arrow in panel 1).</text><rect x="6" y="70" width="488" height="90" fill="white" stroke="#555" stroke-width="0.8"/><text x="14" y="87" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Layout selection and views</text><path d="M6 95H494" fill="none" stroke="#777" stroke-width="0.6"/><text x="14" y="111" font-family="Arial" font-size="11" font-weight="normal" fill="#111">registry.ts + selection.ts: EXPO_PUBLIC_UI_LAYOUT selects once at launch.</text><text x="14" y="125" font-family="Arial" font-size="11" font-weight="normal" fill="#111">refactor: Home / Practice; Overview / Slides / Transcript.</text><text x="14" y="139" font-family="Arial" font-size="11" font-weight="normal" fill="#111">contract-test: development-only alternate arrangement.</text><text x="6" y="183" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Hosts own the shared integration layer</text><rect x="45" y="205" width="449" height="76" fill="white" stroke="#555" stroke-width="0.8"/><text x="53" y="222" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Recording / playback</text><path d="M45 230H494" fill="none" stroke="#777" stroke-width="0.6"/><text x="53" y="246" font-family="Arial" font-size="11" font-weight="normal" fill="#111">recording/service.ts + stopCapture.ts; transcription/playback.ts.</text><text x="53" y="260" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Hosts own native recorder/player lifetimes.</text><rect x="45" y="303" width="449" height="76" fill="white" stroke="#555" stroke-width="0.8"/><text x="53" y="320" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Persistence + media recovery</text><path d="M45 328H494" fill="none" stroke="#777" stroke-width="0.6"/><text x="53" y="344" font-family="Arial" font-size="11" font-weight="normal" fill="#111">recording/storage.ts; review caches; expo-sqlite + expo-file-system.</text><text x="53" y="358" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Planned: scope and deletion journal.</text><rect x="45" y="401" width="449" height="76" fill="white" stroke="#555" stroke-width="0.8"/><text x="53" y="418" font-family="Arial" font-size="11" font-weight="bold" fill="#111">Backend clients</text><path d="M45 426H494" fill="none" stroke="#777" stroke-width="0.6"/><text x="53" y="442" font-family="Arial" font-size="11" font-weight="normal" fill="#111">transcription/service.ts; transcription/client.ts + services/api.ts.</text><text x="53" y="456" font-family="Arial" font-size="11" font-weight="normal" fill="#111">REST operations. Planned: analysis, deletion and auth operations.</text><polyline points="22,190 22,439" fill="none" stroke="#333" stroke-width="0.9"/><polyline points="22,243 45,243" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><polyline points="22,341 45,341" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><polyline points="22,439 45,439" fill="none" stroke="#333" stroke-width="0.9" marker-end="url(#arrow)"/><text x="6" y="500" font-family="Arial" font-size="11" font-weight="normal" fill="#111">Native surfaces: react-native-pdf confirms page changes; expo-audio supplies capture time and one</text><text x="6" y="514" font-family="Arial" font-size="11" font-weight="normal" fill="#111">review player.</text><text x="6" y="542" font-family="Arial" font-size="11" font-weight="normal" fill="#111">A layout arranges views and calls supplied commands. It creates no recorder/player and never</text><text x="6" y="556" font-family="Arial" font-size="11" font-weight="normal" fill="#111">reads storage or calls APIs. Hosts retain player intent and description drafts across panel changes;</text><text x="6" y="570" font-family="Arial" font-size="11" font-weight="normal" fill="#111">native stage surfaces stay mounted during capture/playback.</text></g></svg>