name: App checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node tools/validate-coverage.mjs
      - run: npm run test:coverage
      - run: npm run bundle:android
        if: always()
        env:
          CI: "1"
          EXPO_OFFLINE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: |
            mobile/coverage/
            !mobile/coverage/tmp/**
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outloud
          POSTGRES_USER: outloud
          POSTGRES_PASSWORD: outloud-local-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U outloud" --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s ../tools -p 'test_coverage_report.py' -v
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python -m coverage run manage.py test --noinput
        id: backend_tests
      - name: Coverage reports and group thresholds
        if: always() && (steps.backend_tests.outcome == 'success' || steps.backend_tests.outcome == 'failure')
        run: |
          python -m coverage json
          python -m coverage html
          python ../tools/coverage_report.py backend --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
